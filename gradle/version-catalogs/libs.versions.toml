[versions]
projektor = "4.+"

parchment-plugin = "1.2.0"
fabric-plugin = "1.12.1"
legacy-fabric-plugin = "1.12.1"
ornithe-plugin = "1.12.1"
forge-plugin = "6.0.46"
neoforge-plugin = "2.0.116"

kotlin = "2.0.21"
kotlin-serialization-xml = "0.90.1"
ktor = "3.0.0"
kotlin-html = "0.12.0"

kotlin-utils = "0.8.4"
gradle-utils = "0.8.11"
kotlin-shell-dsl = "0.8.2"

java-poet = "0.7.0"
jsoup = "1.21.2"
okio = "3.9.1"

bedrock = "0.1.3"

[plugins]
projektor = { id = "io.github.diskria.projektor", version.ref = "projektor" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
kotlin-utils = { group = "io.github.diskria", name = "kotlin-utils", version.ref = "kotlin-utils" }
gradle-utils = { group = "io.github.diskria", name = "gradle-utils", version.ref = "gradle-utils" }
kotlin-shell-dsl = { group = "io.github.diskria", name = "kotlin-shell-dsl", version.ref = "kotlin-shell-dsl" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }

kotlin-html = { group = "org.jetbrains.kotlinx", name = "kotlinx-html-jvm", version.ref = "kotlin-html" }
kotlin-serialization-xml = { group = "io.github.pdvrieze.xmlutil", name = "serialization", version.ref = "kotlin-serialization-xml" }

kotlin-jvm-plugin = { group = "org.jetbrains.kotlin.jvm", name = "org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }

parchment-plugin = { group = "org.parchmentmc.librarian.forgegradle", name = "org.parchmentmc.librarian.forgegradle.gradle.plugin", version.ref = "parchment-plugin" }
fabric-plugin = { group = "fabric-loom", name = "fabric-loom.gradle.plugin", version.ref = "fabric-plugin" }
legacy-fabric-plugin = { group = "legacy-looming", name = "legacy-looming.gradle.plugin", version.ref = "legacy-fabric-plugin" }
ornithe-plugin = { group = "ploceus", name = "ploceus.gradle.plugin", version.ref = "ornithe-plugin" }
forge-plugin = { group = "net.minecraftforge.gradle", name = "net.minecraftforge.gradle.gradle.plugin", version.ref = "forge-plugin" }
neoforge-plugin = { group = "net.neoforged.moddev", name = "net.neoforged.moddev.gradle.plugin", version.ref = "neoforge-plugin" }

java-poet = { group = "com.palantir.javapoet", name = "javapoet", version.ref = "java-poet" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
okio = { group = "com.squareup.okio", name = "okio-jvm", version.ref = "okio" }

bedrock = { group = "io.github.recrafter", name = "bedrock", version.ref = "bedrock" }

[bundles]
diskria-utils = [
    "kotlin-utils",
    "gradle-utils",
    "kotlin-shell-dsl",
]
ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
]
loader-plugins = [
    "parchment-plugin",
    "fabric-plugin",
    "legacy-fabric-plugin",
    "ornithe-plugin",
    "forge-plugin",
    "neoforge-plugin",
]
